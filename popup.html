<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 240px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 14px;
    background: #ffffff;
    color: #111827;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 8px;
  }
  p.hint {
    margin: 0 0 12px;
    color: #6b7280;
    font-size: 12px;
  }
  button {
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
  }
  #toggleBtn {
    background: #ff3b30;
    color: #fff;
  }
  #toggleBtn.active {
    background: #16a34a;
  }
  #clearBtn {
    background: #f3f4f6;
    color: #111827;
  }
  #result {
    margin-top: 10px;
    padding: 8px;
    background: #f9fafb;
    border-radius: 6px;
    font-size: 12px;
    display: none;
  }
  #result.show {
    display: block;
  }
  #result b {
    font-size: 15px;
  }
</style>
</head>
<body>
  <h1>Linear Displacement</h1>
  <p class="hint">Click "Start", then click two points on the page. Straight-line distance shown between them.</p>
  <button id="toggleBtn">Start Measuring</button>
  <button id="clearBtn">Clear</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
